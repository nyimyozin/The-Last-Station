name: Build and release Android
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/build_character.py'
      - 'tests/hand_orientation.py'
      - 'audio/**'
      - 'art/**'
      - 'Main.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/publish-android.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tools/build_character.py'
      - 'tests/hand_orientation.py'
      - 'audio/**'
      - 'art/**'
      - 'Main.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'downloads/RELEASE-NOTES-v0.2.2.md'
      - '.github/workflows/publish-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Godot 4.5.1 smoke tests and APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install container's matching Godot templates and Android SDK settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          godot --version
      - name: Check hand mesh orientation
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          python3 tests/hand_orientation.py
      - name: Test optional Futaba animation generator
        shell: bash
        run: python3 tools/prepare_futaba.py --self-test
      - name: Import project
        shell: bash
        run: godot --headless --path . --editor --import --quit
      - name: Run gameplay and multitouch smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . -- --smoke-test 2>&1 | tee smoke-test.log
          grep -q 'SMOKE PASS' smoke-test.log
          if grep -E 'SCRIPT ERROR|Assertion failed|ERROR:' smoke-test.log; then
            echo "Godot reported errors during the smoke test" >&2
            exit 1
          fi
      - name: Check skeletal animation state machine
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/futaba_motion_test.gd 2>&1 | tee futaba-motion.log
          grep -q 'FUTABA MOTION PASS' futaba-motion.log
          if grep -E 'SCRIPT ERROR|Assertion failed|ERROR:' futaba-motion.log; then
            exit 1
          fi
      - name: Export signed ARM64 Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug Android The-Last-Station.apk 2>&1 | tee export.log
          test -s The-Last-Station.apk
          # Godot can emit nonfatal fontconfig warnings after a successful
          # headless export. Trust its exit code, file existence and signature.
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner verify --verbose The-Last-Station.apk
          sha256sum The-Last-Station.apk
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: the-last-station-v0.2.2-android
          path: The-Last-Station.apk
          if-no-files-found: error

  publish:
    name: Publish v0.2.2
    needs: build-android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: the-last-station-v0.2.2-android
          path: release-build
      - name: Verify proprietary character is explicitly supplied
        shell: bash
        run: |
          set -euo pipefail
          # Do not publish a misleading v0.2.2 APK with the fallback avatar.
          test -s art/character/futaba_animated.glb || { echo "Missing private Futaba asset; release blocked" >&2; exit 1; }
      - name: Verify and package current source
        shell: bash
        run: |
          set -euo pipefail
          test -s release-build/The-Last-Station.apk
          sha256sum release-build/The-Last-Station.apk
          zip -qr release-build/The-Last-Station-Source.zip . \
            -x '.git/*' '.godot/*' 'downloads/parts/*' 'release-build/*' 'art/character/futaba_animated.glb' 'art/character/*.vrm'
      - name: Publish new development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 \
            release-build/The-Last-Station.apk \
            release-build/The-Last-Station-Source.zip \
            --target "$GITHUB_SHA" \
            --title "Platform Zero — Futaba animation candidate (v0.2.2)" \
            --notes-file downloads/RELEASE-NOTES-v0.2.2.md \
            --prerelease
